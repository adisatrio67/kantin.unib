<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Kantin Perpus UNIB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2fa;--card:#fff;--ink:#0f1f3d;--mut:#55658a;--pri:#0d2b6b;--acc:#f2b800;--line:#d0daef;--onpri:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1428;--card:#121f3a;--ink:#e8eefb;--mut:#9fb0d0;--pri:#163b86;--line:#223458}}
:root[data-theme="dark"]{--bg:#0a1428;--card:#121f3a;--ink:#e8eefb;--mut:#9fb0d0;--pri:#163b86;--line:#223458}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 18px}
header{background:var(--pri);color:var(--onpri);padding:28px 0 30px;border-bottom:6px solid var(--acc)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-weight:600;letter-spacing:.2px}
.brand img{height:64px;width:auto;display:block;background:#fff;border-radius:12px;padding:5px}
.brand small{display:block;font-weight:400;opacity:.8}
header h1{font-size:clamp(1.9rem,6vw,3.2rem);line-height:1.05;margin:0 0 10px;font-weight:800;max-width:14ch}
header p{margin:0;max-width:48ch;opacity:.88}
.floors{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.floors span{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 12px;font-size:.9rem}
.floors b{color:var(--acc)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px}
input[type=search]{flex:1;min-width:200px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:99px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding-bottom:40px}
.stall{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.stall:hover{border-color:var(--pri)}
.cover{height:150px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:2.6rem}
.sb{padding:14px 16px 16px}
.sb h3{margin:0 0 4px;font-size:1.15rem}
.sb p{margin:0 0 10px;color:var(--mut);font-size:.9rem}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut)}
.tag{background:var(--acc);color:#2b2100;border-radius:6px;padding:1px 8px;font-weight:600;font-size:.8rem}
.dh .kt{margin:4px 0 0;font-weight:600;color:var(--ink)}
.kt a{color:inherit;text-decoration:underline}
.back{background:none;border:0;color:var(--pri);font:inherit;font-weight:600;cursor:pointer;padding:18px 0 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .back{color:var(--acc)}}
:root[data-theme="dark"] .back{color:var(--acc)}
.banner{height:210px;border-radius:14px;background-size:cover;background-position:center;margin:0 0 16px}
.dh{display:flex;gap:16px;align-items:center;margin:6px 0 18px}
.dh .cover{width:84px;height:84px;border-radius:16px;font-size:2.4rem;flex:none}
.dh h2{margin:0;font-size:1.7rem}
.dh p{margin:2px 0 0;color:var(--mut)}
.wa{display:inline-block;background:var(--acc);color:#2b2100;font-weight:700;text-decoration:none;padding:10px 18px;border-radius:10px;margin:0 0 20px}
.menu{list-style:none;margin:0;padding:0 0 40px;display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;display:flex;justify-content:space-between;gap:14px;align-items:center}
.item h4{margin:0;font-size:1rem}
.item small{color:var(--mut)}
.price{font-weight:800;white-space:nowrap}
.empty{padding:30px 0;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:18px 0 28px;color:var(--mut);font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap">
<div class="brand"><img id="logo" alt="Logo Universitas Bengkulu" hidden><div>Universitas Bengkulu<small>Perpustakaan UNIB</small></div></div>
<h1>Kantin Perpus UNIB</h1>
<p>Katalog digital UMKM kantin Perpustakaan Universitas Bengkulu. Pilih kantin, lalu lihat menu dan harganya.</p>
</div></header>

<main class="wrap">
<section id="home">
<div class="bar"><input type="search" id="q" placeholder="Cari kantin atau menu, misalnya: kopi" aria-label="Cari kantin atau menu"></div>
<div class="chips" id="cats"></div>
<div class="grid" id="grid"></div>
<p class="empty" id="none" hidden>Tidak ada kantin yang cocok. Coba kata kunci lain atau pilih kategori Semua.</p>
</section>

<section id="detail" hidden>
<button class="back" id="back">&larr; Kembali ke daftar kantin</button>
<div class="banner" id="db" hidden></div>
<div class="dh"><div class="cover" id="dc"></div><div><h2 id="dn"></h2><p id="dd"></p><p id="dk" class="kt"></p></div></div>
<div class="chips" id="mcats"></div>
<ul class="menu" id="menu"></ul>
</section>
</main>

var rp=function(x){return typeof x==="number"?"Rp"+x.toLocaleString("id-ID"):x};
var state={cat:"Semua",q:""};
var $=function(i){return document.getElementById(i)};

function chips(box,list,cur,fn){
  box.innerHTML="";
  list.forEach(function(c){
    var b=document.createElement("button");b.className="chip";b.textContent=c;
    b.setAttribute("aria-pressed",c===cur);b.onclick=function(){fn(c)};box.appendChild(b);
  });
}
function renderHome(){
  var cats=["Semua"].concat(KANTIN.map(function(k){return k.kat}).filter(function(v,i,a){return a.indexOf(v)===i}));
  chips($("cats"),cats,state.cat,function(c){state.cat=c;renderHome()});
  var q=state.q.toLowerCase();
  var list=KANTIN.filter(function(k){
    var okc=state.cat==="Semua"||k.kat===state.cat;
    var okq=!q||k.nama.toLowerCase().indexOf(q)>-1||k.menu.some(function(m){return m.n.toLowerCase().indexOf(q)>-1});
    return okc&&okq;
  });
  $("grid").innerHTML=list.map(function(k){
    return '<button class="stall" data-id="'+k.id+'"><div class="cover" style="background:'+k.warna+(FOTO[k.id]?' url('+FOTO[k.id]+') center/cover':'')+'">'+(FOTO[k.id]?'':k.emoji)+'</div><div class="sb"><h3>'+k.nama+'</h3><p>'+k.desk+'</p><div class="meta"><span class="tag">'+k.kat+'</span><span>'+k.menu.length+' menu</span></div></div></button>';
  }).join("");
  $("none").hidden=list.length>0;
  Array.prototype.forEach.call(document.querySelectorAll(".stall"),function(b){b.onclick=function(){location.hash=b.dataset.id}});
}
function renderDetail(k){
  $("dc").textContent=k.emoji;$("dc").style.background=k.warna;var f=FOTO[k.id];$("db").hidden=!f;if(f)$("db").style.backgroundImage="url("+f+")";$("dc").hidden=!!f;
  $("dn").textContent=k.nama;$("dd").textContent=k.kat+" · Buka "+k.jam;
  var n="0"+k.wa.slice(2);$("dk").innerHTML='Kontak: <a href="tel:+'+k.wa+'">'+n.slice(0,4)+"-"+n.slice(4,8)+"-"+n.slice(8)+'</a>';
  var tipe=["Semua"].concat(k.menu.map(function(m){return m.t}).filter(function(v,i,a){return a.indexOf(v)===i}));
  var cur=k._cur||"Semua";
  chips($("mcats"),tipe,cur,function(c){k._cur=c;renderDetail(k)});
  $("menu").innerHTML=k.menu.filter(function(m){return cur==="Semua"||m.t===cur}).map(function(m){
    return '<li class="item"><div><h4>'+m.n+'</h4><small>'+m.t+'</small></div><span class="price">'+rp(m.h)+'</span></li>';
  }).join("");
}
function route(){
  var k=KANTIN.filter(function(x){return x.id===location.hash.slice(1)})[0];
  $("home").hidden=!!k;$("detail").hidden=!k;
  if(k){renderDetail(k);window.scrollTo(0,0)}else renderHome();
}
$("q").oninput=function(e){state.q=e.target.value;renderHome()};
$("back").onclick=function(){location.hash=""};
if(LOGO){$("logo").src=LOGO;$("logo").hidden=false}
window.onhashchange=route;route();
</script>
